name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # MySQL nodes are slow to boot/clone compared to redis; the full suite
    # also builds a second wrapper image in-scenario (patch skew) and pulls
    # the previous-LTS seed image (cross-version conversion). The suite
    # paced ~52 min on 2026-08-27 but ~60 on 2026-08-31 runners, and the
    # 60-min cap cut a run mid-suite with no log blob left to autopsy
    # (cancelled 2026-08-31 01:04Z). 90 fits the suite plus variance
    # without masking a hang: every scenario still fails on its own
    # internal waits, far below the cap.
    timeout-minutes: 90

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: mysql-wrapper/Dockerfile
          build-args: MYSQL_VERSION=8.4
          platforms: linux/amd64
          tags: mysql-ha-e2e:8.4
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run e2e harness
        # GitHub's default `run:` shell has no pipefail, so without it the
        # pipe to tee swallows the harness's failure-count exit code and the
        # job reports success no matter how many scenarios failed.
        run: set -o pipefail; ./test/e2e.sh 2>&1 | tee e2e.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e.log
