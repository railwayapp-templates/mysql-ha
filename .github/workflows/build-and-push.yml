name: Build and Push Docker Images

on:
  # Run daily at midnight UTC. Daily (not weekly) keeps the window between an
  # upstream series release and our first per-series build short: HA
  # conversion pins the source's own series, so a brand-new upstream series
  # is convertible only once discover-mysql-series has seen it and this
  # workflow has published its image.
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the content gate and rebuild+push everything"
        type: boolean
        default: false
  # Build on push to main
  push:
    branches:
      - main
    paths:
      - 'mysql-wrapper/**'
      - 'haproxy/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-and-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  HAPROXY_VERSION: "3.2"
  # The single policy knob for which MySQL majors get per-series builds —
  # mirrors the template's supportedImageMajorVersions. The `X.Y` series
  # within each major are discovered from Docker Hub on every run, never
  # hardcoded here.
  MYSQL_SUPPORTED_MAJORS: "8 9"
  # No suffix - publish to regular tags
  BETA_SUFFIX: ''

jobs:
  # Detect which components changed to avoid unnecessary builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      mysql-wrapper: ${{ steps.filter.outputs.mysql-wrapper }}
      haproxy: ${{ steps.filter.outputs.haproxy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mysql-wrapper:
              - 'mysql-wrapper/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'
            haproxy:
              - 'haproxy/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'

  # Enumerate every `X.Y` series tag Docker Hub publishes for the supported
  # MySQL majors. The list is discovered per run instead of hardcoded so a
  # new upstream series (LTS or innovation) starts building the day Docker
  # Hub carries it — the platform's HA conversion pins the adopted service's
  # own `major.minor` series, so a series with no published image is a
  # series whose users cannot convert. EOL innovation series stay in the set
  # for the same reason: building a series a user already runs is strictly
  # better than stranding their conversion.
  discover-mysql-series:
    needs: changes
    if: ${{ needs.changes.outputs['mysql-wrapper'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      series: ${{ steps.discover.outputs.series }}

    steps:
      - name: Discover MySQL series tags on Docker Hub
        id: discover
        run: |
          # Use the Docker Registry v2 API (registry-1.docker.io, anonymous
          # pull token) rather than the Hub website API (hub.docker.com):
          # the website API hard-blocks shared GitHub runner IPs with
          # persistent 403s, while the registry endpoint is the same path
          # every `docker pull` takes and is expected to serve CI runners.
          # --retry-all-errors: plain --retry does not retry 403/429.
          token=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/mysql:pull" \
            | jq -r .token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "could not obtain an anonymous pull token" >&2
            exit 1
          fi

          url="https://registry-1.docker.io/v2/library/mysql/tags/list?n=1000"
          : > /tmp/hub-tags.txt
          pages=0
          while [ -n "$url" ]; do
            if [ "$pages" -ge 50 ]; then
              echo "more than 50 pages of registry tags; refusing to loop forever" >&2
              exit 1
            fi
            resp=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
              -H "Authorization: Bearer $token" -D /tmp/tag-headers.txt "$url")
            echo "$resp" | jq -r '.tags[]' >> /tmp/hub-tags.txt
            # RFC-5988 pagination: a Link rel="next" header carries the
            # relative URL of the next page; no header means last page.
            next=$(sed -nE 's/^[Ll]ink: *<([^>]+)>; *rel="next".*/\1/p' /tmp/tag-headers.txt | tr -d '\r')
            if [ -n "$next" ]; then
              url="https://registry-1.docker.io${next}"
            else
              url=""
            fi
            pages=$((pages + 1))
          done

          : > /tmp/series.txt
          for major in $MYSQL_SUPPORTED_MAJORS; do
            found=$(grep -E "^${major}\.[0-9]+$" /tmp/hub-tags.txt | sort -uV)
            if [ -z "$found" ]; then
              # Anti-shrink: an empty result for a supported major means the
              # discovery is broken (API change, filter regression), not that
              # the major vanished upstream — fail loudly rather than
              # silently stop building its series.
              echo "no X.Y series discovered for supported major ${major}" >&2
              exit 1
            fi
            echo "$found" >> /tmp/series.txt
          done

          echo "discovered series:"
          cat /tmp/series.txt

          echo "series=$(jq -Rnc '[inputs]' < /tmp/series.txt)" >> "$GITHUB_OUTPUT"

      # A published :X.Y tag is a build line users are pinned to. If the
      # discovered set ever fails to cover one (Docker Hub API glitch, filter
      # regression), that series would silently stop receiving builds — fail
      # the run instead. Best-effort on the listing side only: a ghcr API
      # hiccup warns and proceeds so it cannot block image builds. Published
      # series outside MYSQL_SUPPORTED_MAJORS are exempt, so retiring a major
      # stays a one-knob policy change.
      - name: Refuse to shrink the published series set (best-effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="/orgs/${{ github.repository_owner }}/packages/container/mysql-ha%2Fmysql/versions?per_page=100"
          if published=$(gh api --paginate "$endpoint" --jq '.[].metadata.container.tags[]' 2>/dev/null); then
            majors_re=$(echo "$MYSQL_SUPPORTED_MAJORS" | tr ' ' '|')
            published_series=$(echo "$published" | grep -E "^(${majors_re})\.[0-9]+$" | sort -uV || true)
            missing=""
            for tag in $published_series; do
              grep -qx "$tag" /tmp/series.txt || missing="$missing $tag"
            done
            if [ -n "$missing" ]; then
              echo "discovered set does not cover already-published series:$missing" >&2
              exit 1
            fi
            echo "coverage ok: all published series are in the discovered set"
          else
            echo "warning: could not list published ghcr tags; skipping coverage guard"
          fi

  # Build Rust binary for mysql-wrapper (AMD64 - alpine, native, fast ~2-3min)
  # The binary is version-agnostic — one build covers all MySQL major versions.
  build-rust-binaries-mysql-wrapper-amd64:
    needs: changes
    if: ${{ needs.changes.outputs['mysql-wrapper'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for mysql-wrapper amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./mysql-wrapper/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-mysql-wrapper-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/mysql-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=mysql-rust-binaries
          cache-to: type=gha,mode=max,scope=mysql-rust-binaries

  # Build Rust binary for haproxy (AMD64 - alpine, native, fast ~2-3min)
  build-rust-binaries-haproxy-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for haproxy amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-haproxy-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=haproxy-rust-binaries
          cache-to: type=gha,mode=max,scope=haproxy-rust-binaries

  # Build mysql-wrapper for AMD64 — one continuously rebuilt image per MySQL
  # `X.Y` series, discovered from Docker Hub each run. A MySQL data dir
  # cannot be downgraded and series upgrades (8.0 → 8.4 → 9.x) are one-way,
  # so the platform's HA conversion pins a converted service to its own
  # `major.minor` series tag; every series a user might be standing on must
  # therefore be a real build line that keeps receiving upstream patch,
  # base-image and wrapper (mysql-wrapper entrypoint / health server)
  # updates for as long as this workflow runs. The hardcoded two-entry
  # matrix this replaces ("8.4", "9.4") left users on any other series
  # (8.0, or an innovation series like 9.2) with no published image at all —
  # their conversion pinned a tag that does not exist.
  #
  # MYSQL_SUPPORTED_MAJORS (env, above) is the single policy knob; the
  # per-series list is never edited by hand.
  build-mysql-wrapper-amd64:
    needs: [changes, build-rust-binaries-mysql-wrapper-amd64, discover-mysql-series]
    if: ${{ needs.changes.outputs['mysql-wrapper'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Each series is an independent build line — one broken series must
      # not cancel the others' builds.
      fail-fast: false
      matrix:
        mysql_version: ${{ fromJson(needs.discover-mysql-series.outputs.series) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Skip the build entirely — same digest, no fleet redeploys — unless
      # something REAL moved: the repo code that reaches the image, the
      # upstream base image, or the base's pending-security-fix set (a
      # superseded series' base never re-mints upstream, so pending fixes
      # are the only way OS updates reach it). The key is planted on the
      # published image as a label; digest-tracking consumers (autoUpdates
      # tagMode "sha") therefore only see a new digest when there is
      # something worth redeploying for. Fails OPEN to building — a gate
      # error must never silently freeze a tag.
      - name: Content gate
        id: gate
        run: |
          set -o pipefail
          IMG="${{ env.IMAGE_PREFIX }}/mysql"
          TAG="${{ matrix.mysql_version }}${{ env.BETA_SUFFIX }}"
          BASE="mysql:${{ matrix.mysql_version }}"

          GATE_OK=true
          CODE_KEY=$(git rev-parse HEAD:mysql-wrapper HEAD:common HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-16) || GATE_OK=false
          BASE_DIGEST=$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest.Digest}}' | tr -d '"') || GATE_OK=false
          docker pull -q "$BASE" >/dev/null || GATE_OK=false
          # Oracle Linux base: microdnf. --assumeno exits nonzero when there
          # IS a pending transaction, so tolerate the exit code and require
          # non-empty output instead.
          PKG_RAW=$(docker run --rm "$BASE" bash -c "microdnf --assumeno upgrade 2>&1 | sort" || true)
          [ -n "$PKG_RAW" ] || GATE_OK=false
          PKG_KEY=$(printf '%s' "$PKG_RAW" | sha256sum | cut -c1-16)

          if [ "$GATE_OK" != "true" ] || [ -z "$CODE_KEY" ] || [ -z "$BASE_DIGEST" ] || [ -z "$PKG_KEY" ]; then
            echo "::warning::content gate failed for ${TAG}; building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "key=gate-error-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY=$(printf '%s\n' "$CODE_KEY" "$BASE_DIGEST" "$PKG_KEY" | sha256sum | cut -c1-32)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          PUBLISHED_KEY=$(docker buildx imagetools inspect "$IMG:$TAG" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '(.config // .["linux/amd64"].config) | .Labels["railway.content-key"] // empty' 2>/dev/null || true)

          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            echo "force requested — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$KEY" = "$PUBLISHED_KEY" ]; then
            echo "unchanged (key $KEY) — skipping build; digest stays put"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed (key $KEY, published ${PUBLISHED_KEY:-<none>}) — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push only the immutable sha tag here; the resolvable :X.Y series tag
      # is minted below AFTER the bundled-version guard, so a base-image
      # mixup can never reach a tag the platform pins. No :latest — every
      # published tag pins an exact MySQL series or commit SHA.
      - name: Build and push mysql-wrapper for amd64
        if: steps.gate.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./mysql-wrapper/Dockerfile
          build-args: |
            MYSQL_VERSION=${{ matrix.mysql_version }}
            PKG_REFRESH=${{ steps.gate.outputs.key }}
          labels: |
            railway.content-key=${{ steps.gate.outputs.key }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/mysql-rust-binaries:${{ steps.sha.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mysql:${{ matrix.mysql_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/mysql:${{ matrix.mysql_version }}${{ env.BETA_SUFFIX }}
          cache-to: type=inline

      # Unchanged image: keep the per-commit pin tag current WITHOUT minting
      # a new digest — imagetools create only adds a tag reference. The
      # digest already passed the bundled-version guard when first published.
      - name: Refresh pin tags on unchanged image
        if: steps.gate.outputs.changed == 'false'
        run: |
          IMG="${{ env.IMAGE_PREFIX }}/mysql"
          docker buildx imagetools create \
            -t "$IMG:${{ matrix.mysql_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}" \
            "$IMG:${{ matrix.mysql_version }}${{ env.BETA_SUFFIX }}"

      # The tag IS the compatibility contract (the conversion pin trusts that
      # :8.4 bundles a MySQL 8.4.x), so refuse to publish a build whose base
      # image bundles anything else rather than poison the tag.
      - name: Verify the bundled series matches the matrix entry, then publish
        if: steps.gate.outputs.changed == 'true'
        run: |
          img="${{ env.IMAGE_PREFIX }}/mysql:${{ matrix.mysql_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          version=$(docker run --rm --entrypoint mysqld "$img" --version)
          echo "bundled: $version"
          series=$(echo "$version" | sed -nE 's/.*Ver ([0-9]+\.[0-9]+)\..*/\1/p')
          if [ -z "$series" ]; then
            echo "could not parse a major.minor out of mysqld --version" >&2
            exit 1
          fi
          if [ "$series" != "${{ matrix.mysql_version }}" ]; then
            echo "bundled series $series does not match matrix entry ${{ matrix.mysql_version }}" >&2
            exit 1
          fi

          docker buildx imagetools create \
            -t "${{ env.IMAGE_PREFIX }}/mysql:${{ matrix.mysql_version }}${{ env.BETA_SUFFIX }}" \
            "$img"

  # Build haproxy image for AMD64
  build-haproxy-amd64:
    needs: [changes, build-rust-binaries-haproxy-amd64]
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA and version parts
        id: meta
        run: |
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "major=$(echo ${{ env.HAPROXY_VERSION }} | cut -d. -f1)" >> $GITHUB_OUTPUT

      # Same content gate as mysql-wrapper (see that job for rationale);
      # package dimension via apk. The fleet's edge nodes run autoUpdates
      # tagMode "sha" — a spuriously re-minted digest here rolls every
      # HAProxy in every cluster for nothing.
      - name: Content gate
        id: gate
        run: |
          set -o pipefail
          IMG="${{ env.IMAGE_PREFIX }}/haproxy"
          TAG="${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}"
          BASE="haproxy:${{ env.HAPROXY_VERSION }}-alpine"

          GATE_OK=true
          CODE_KEY=$(git rev-parse HEAD:haproxy HEAD:common HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-16) || GATE_OK=false
          BASE_DIGEST=$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest.Digest}}' | tr -d '"') || GATE_OK=false
          docker pull -q "$BASE" >/dev/null || GATE_OK=false
          PKG_KEY=$(docker run --user root --rm "$BASE" sh -c "apk update -q >/dev/null 2>&1; apk version -l '<' 2>/dev/null | sort" | sha256sum | cut -c1-16) || GATE_OK=false

          if [ "$GATE_OK" != "true" ] || [ -z "$CODE_KEY" ] || [ -z "$BASE_DIGEST" ] || [ -z "$PKG_KEY" ]; then
            echo "::warning::content gate failed for haproxy; building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "key=gate-error-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY=$(printf '%s\n' "$CODE_KEY" "$BASE_DIGEST" "$PKG_KEY" | sha256sum | cut -c1-32)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          PUBLISHED_KEY=$(docker buildx imagetools inspect "$IMG:$TAG" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '(.config // .["linux/amd64"].config) | .Labels["railway.content-key"] // empty' 2>/dev/null || true)

          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            echo "force requested — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$KEY" = "$PUBLISHED_KEY" ]; then
            echo "unchanged (key $KEY) — skipping build; digest stays put"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed (key $KEY, published ${PUBLISHED_KEY:-<none>}) — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push haproxy for amd64
        if: steps.gate.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          build-args: |
            HAPROXY_VERSION=${{ env.HAPROXY_VERSION }}
            PKG_REFRESH=${{ steps.gate.outputs.key }}
          labels: |
            railway.content-key=${{ steps.gate.outputs.key }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.meta.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}-${{ steps.meta.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}
          cache-to: type=inline

      - name: Refresh pin tags on unchanged image
        if: steps.gate.outputs.changed == 'false'
        run: |
          IMG="${{ env.IMAGE_PREFIX }}/haproxy"
          SRC="$IMG:${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}"
          docker buildx imagetools create \
            -t "$IMG:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}" \
            -t "$IMG:${{ env.HAPROXY_VERSION }}-${{ steps.meta.outputs.short }}${{ env.BETA_SUFFIX }}" \
            "$SRC"
